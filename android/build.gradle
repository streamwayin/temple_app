allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Some older plugins (e.g. flutter_inappwebview 5.x, flutter_native_splash 2.2.x) don't
    // declare an Android Gradle namespace, which AGP 8+ requires. Backfill it from each
    // plugin's AndroidManifest.xml `package` attribute instead of forking those plugins.
    // Must be registered here (before evaluationDependsOn below forces :app to evaluate).
    afterEvaluate {
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null && androidExt.hasProperty('namespace') && androidExt.namespace == null) {
            def manifestFile = project.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def matcher = (manifestFile.text =~ /package="([^"]+)"/)
                if (matcher.find()) {
                    androidExt.namespace = matcher.group(1)
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
